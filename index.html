<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Stick Fight The Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      #room-tools{width:min(960px,100%);margin:12px auto;padding:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#17191f;color:#f6f5f1;font:14px system-ui,sans-serif;border:1px solid #ffffff24;border-radius:10px}
      #room-tools input{min-width:0;padding:9px 10px;border:1px solid #ffffff35;border-radius:7px;background:#252832;color:inherit}
      #room-name{width:150px}#room-code{width:126px;text-transform:uppercase;letter-spacing:.1em}
      #room-tools button{padding:9px 12px;border:0;border-radius:7px;background:#d0f274;color:#17190f;font-weight:700;cursor:pointer}
      #room-tools button.secondary{background:#383b45;color:#fff}
      #room-tools button.start-game{background:#ff6f61;color:#21100e}
      #wss-status{flex:1 1 180px;color:#c3c5ce;min-height:22px}
      @media(max-width:650px){#room-tools{margin:0 auto 10px;border-radius:0}#wss-status{flex-basis:100%}}
    </style>
  </head>
  <body>
    <section id="room-tools" aria-label="Stick Fight online rooms">
      <input id="room-name" maxlength="20" placeholder="Player name" value="Player" aria-label="Player name">
      <button onclick="roomAction('PageCreateRoom')">Create room</button>
      <button class="secondary" onclick="roomAction('PageQuickJoin')">Quick join</button>
      <input id="room-code" maxlength="6" placeholder="ROOM CODE" aria-label="Room code">
      <button class="secondary" onclick="joinRoomByCode()">Join code</button>
      <button class="start-game" onclick="roomAction('PageStartGame')">Start game</button>
      <button class="secondary" onclick="copyRoomCode()">Copy code</button>
      <button class="secondary" onclick="roomAction('PageLeaveRoom')">Leave</button>
      <span id="wss-status" role="status" aria-live="polite">Load the game, then create a room or enter a friend's code.</span>
    </section>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Stick Fight The Game</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var unityInstance = null;

      function roomAction(method) {
        if (!unityInstance) { document.getElementById("wss-status").textContent = "Wait for the game to finish loading."; return; }
        unityInstance.SendMessage("StickFightWssTransport", method, document.getElementById("room-name").value || "Player");
      }
      function joinRoomByCode() {
        if (!unityInstance) { document.getElementById("wss-status").textContent = "Wait for the game to finish loading."; return; }
        var name = document.getElementById("room-name").value || "Player";
        var code = document.getElementById("room-code").value.trim().toUpperCase();
        unityInstance.SendMessage("StickFightWssTransport", "PageJoinRoom", name + "|" + code);
      }
      function copyRoomCode() {
        var code = window.stickFightRoomCode;
        if (!code) { document.getElementById("wss-status").textContent = "Create or join a room first."; return; }
        document.getElementById("room-code").value = code;
        navigator.clipboard.writeText(code).then(function () {
          document.getElementById("wss-status").textContent = "Room code copied: " + code;
        });
      }

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var buildVersion = "wss-20261017-1819";
      var loaderUrl = buildUrl + "/StickFightWebGL.loader.js?v=" + buildVersion;
      var config = {
        dataUrl: buildUrl + "/StickFightWebGL.data.br?v=" + buildVersion,
        frameworkUrl: buildUrl + "/StickFightWebGL.framework.js.br?v=" + buildVersion,
        codeUrl: buildUrl + "/StickFightWebGL.wasm.br?v=" + buildVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Landfall West",
        productName: "Stick Fight The Game",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((instance) => {
                unityInstance = instance;
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
