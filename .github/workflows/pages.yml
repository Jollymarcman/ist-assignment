name: Deploy Stick Fight WebGL to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "Build/**"
      - "StreamingAssets/**"
      - "TemplateData/**"
      - "site/index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the Unity WebGL player
        run: |
          mkdir -p dist/game/Build
          cp site/index.html dist/index.html
          cp index.html dist/game/index.html
          cp -R TemplateData StreamingAssets dist/game/
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const zlib = require("node:zlib");
          for (const name of fs.readdirSync("Build")) {
            const source = path.join("Build", name);
            if (!fs.statSync(source).isFile()) continue;
            const outputName = name.endsWith(".br") ? name.slice(0, -3) : name;
            const bytes = fs.readFileSync(source);
            fs.writeFileSync(
              path.join("dist/game/Build", outputName),
              name.endsWith(".br") ? zlib.brotliDecompressSync(bytes) : bytes
            );
          }
          const pagePath = "dist/game/index.html";
          const html = fs.readFileSync(pagePath, "utf8")
            .replaceAll(".data.br", ".data")
            .replaceAll(".framework.js.br", ".framework.js")
            .replaceAll(".wasm.br", ".wasm");
          fs.writeFileSync(pagePath, html);
          NODE
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Stick Fight
        id: deployment
        uses: actions/deploy-pages@v4
